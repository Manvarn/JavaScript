<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Record Example</title>
    <style>
      /* Basic styling for the table */
      /* table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      table,
      th,
      td {
        border: 1px solid black;
      }
      th,
      td {
        padding: 8px;
        text-align: left;
      } */
    </style>
  </head>
  <body>
    <h1>Enter Name and Age</h1>

    <!-- Form for entering name and age -->
    <label for="name">Name:</label>
    <input type="text" id="name" placeholder="Enter name" />
    <br /><br />

    <label for="age">Age:</label>
    <input type="number" id="age" placeholder="Enter age" />
    <br /><br />

    <!-- Button to trigger the addRecord function -->
    <button onclick="addRecord()">Add Record</button>

    <h2>Records:</h2>
    <!-- Table to display records -->
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
        </tr>
      </thead>
      <tbody id="data-table-body">
        <!-- Table rows will be inserted here -->
      </tbody>
    </table>

    <script>
      // Initialize an empty array to store the records
      let data = [];

      // Function to add a new record
      function addRecord() {
        // Get the values from the input fields
        const nameInput = document.getElementById("name");
        const ageInput = document.getElementById("age");

        const name = nameInput.value.trim(); // Remove extra spaces around the name
        const age = ageInput.value.trim(); // Remove extra spaces around the age

        // Check if both fields have values
        if (name && age) {
          // Add the new record to the data array
          data.push({ name, age });

          // Clear the input fields
          nameInput.value = "";
          ageInput.value = "";

          // Display the updated table
          showTable();
        } else {
          // If any field is empty, show an alert
          alert("Please fill in all fields.");
        }
      }

      // Function to update the table with the current data
      function showTable() {
        // Get the table body element where records will be added
        const tableBody = document.getElementById("data-table-body");

        // Clear the existing rows
        tableBody.innerHTML = "";

        // Loop through the data array and create a row for each record
        data.forEach((item) => {
          const row = document.createElement("tr");

          // Create cells for name and age
          const nameCell = document.createElement("td");
          nameCell.textContent = item.name;
          const ageCell = document.createElement("td");
          ageCell.textContent = item.age;

          // Append the cells to the row
          row.appendChild(nameCell);
          row.appendChild(ageCell);

          // Append the row to the table body
          tableBody.appendChild(row);
        });
      }
    </script>
  </body>
</html>
